name: ci

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "brain_service/**"
      - "scripts/**"
      - "brain/**"
      - "modules/**"
      - "FlyBrain.sln"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
      - run: dotnet build FlyBrain.sln -c Release
      - run: dotnet test FlyBrain.sln -c Release --no-build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/requirements.txt
      - run: python -m pip install -r brain/requirements.txt
      - run: python -m pytest tests/python -q -p no:cacheprovider
