<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body,#map{height:100%;margin:0;background:#121821}.leaflet-container{font-family:Segoe UI,Arial}.notice{position:absolute;z-index:1000;left:12px;bottom:30px;background:#18212c;color:#d5dde7;padding:8px;border-radius:6px;font-size:12px}.current{transition:transform .35s ease-out}.best{filter:drop-shadow(0 0 4px #8bf7a1)}</style></head>
<body><div id="map"></div><div class="notice">OpenStreetMap © contributors · tiles require network</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map,target,current,best,trail;const notice=document.querySelector('.notice');
function icon(html,kind){return L.divIcon({className:kind,html:html,iconSize:[30,30],iconAnchor:[15,15]});}
if(window.L){map=L.map('map',{worldCopyJump:true}).setView([20,0],2);const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);tiles.on('tileerror',()=>notice.textContent='Map tiles unavailable — manual coordinate decode and autonomous search remain available.');map.on('click',e=>chrome.webview.postMessage({type:'map-click',lat:e.latlng.lat,lon:e.latlng.lng}));}else{notice.textContent='Map unavailable — manual coordinate decode and autonomous search remain available.';}
function markerHtml(kind){if(kind==='target')return '<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="9" fill="none" stroke="#65d6ff" stroke-width="3"/><path d="M15 1v7M15 22v7M1 15h7M22 15h7" stroke="#65d6ff" stroke-width="2"/></svg>';if(kind==='best')return '<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="8" fill="#8bf7a1" fill-opacity=".25" stroke="#8bf7a1" stroke-width="3"/><circle cx="15" cy="15" r="3" fill="#8bf7a1"/></svg>';return '<svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 13c-5-9-12-8-10-1 1 3 5 4 8 4M15 13c5-9 12-8 10-1-1 3-5 4-8 4M15 13v12M11 25h8" fill="none" stroke="#ffbd59" stroke-width="2.5"/></svg>';}
function setMarker(kind,lat,lon,label){if(!map)return;let old=kind==='target'?target:kind==='best'?best:current;if(old){old.setLatLng([lat,lon]);old.setTooltipContent(label);return;}let created=L.marker([lat,lon],{icon:icon(markerHtml(kind),kind)}).addTo(map).bindTooltip(label);if(kind==='target')target=created;else if(kind==='best')best=created;else current=created;}
function removeMarker(kind){let value=kind==='best'?best:current;if(value&&map)map.removeLayer(value);if(kind==='best')best=null;else current=null;}
function setTrail(points){if(!map)return;if(trail){map.removeLayer(trail);trail=null;}if(points&&points.length>1)trail=L.polyline(points,{color:'#ffbd59',weight:2,opacity:.75}).addTo(map);}
function clearSearch(){removeMarker('current');removeMarker('best');setTrail([]);}
window.topoMap={setTarget:(lat,lon,label)=>setMarker('target',lat,lon,label),setFly:(lat,lon,label)=>setMarker('current',lat,lon,label),setCurrent:(lat,lon,label)=>setMarker('current',lat,lon,label),setBest:(lat,lon,label)=>setMarker('best',lat,lon,label),setTrail,clearSearch};
</script></body></html>
